<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Camera</title>
    <style>
        * {
            box-sizing: border-box;
        }

        #videoArea {
            width: 640px;
        }

        #videoArea img {
            width: 100%;
            object-fit: contain;
        }

        #camArea {
            width: 1280px;
            max-width: 100%;
        }

        #camArea img {
            width: 100%;
            object-fit: contain;
        }

        #recordVideo {
            width: 640px;
            max-width: 100%;
        }

        #recordVideo img {
            width: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div>
        <div>
            <button onclick="start()">추적 시작</button>
            <button onclick="stop()">중지</button>
            <div id="status">대기중</div>
        </div>

        <div id="videoArea"></div>
    </div>

    <div>
        <h2>웹캠 출력장소</h2>

        <div>
            <button onclick="camLink()">카메라 연결</button>
            <button onclick="camClose()">연결 끊기</button>
        </div>

        <div id="camArea"></div>
    </div>

    <div>
        <h2>녹화 출력장소</h2>

        <div>
            <button onclick="startVideo()">녹화 시작</button>
            <button onclick="stopVideo()">녹화 중지</button>
        </div>

        <div id="recordVideo"></div>
    </div>

    <script>
        function startVideo() {
            document.getElementById("recordVideo").innerHTML = `
                <img src="http://127.0.0.1:8000/record">
            `;
        }

        async function stopVideo() {
            document.getElementById("recordVideo").innerHTML = "";

            await fetch("http://127.0.0.1:8000/stop", {
                method: "POST"
            });
        }

        function camLink() {
            const cam = document.getElementById("camArea");

            cam.innerHTML = `
                <img src="http://127.0.0.1:8000/webcam">
            `;
        }

        function camClose() {
            const cam = document.getElementById("camArea");
            cam.innerHTML = "연결이 끊겼습니다.";
        }

        function start() {
            const videoArea = document.getElementById("videoArea");
            const status = document.getElementById("status");

            videoArea.innerHTML = `
                <img src="http://127.0.0.1:8000/video">
            `;

            status.innerHTML = "객체 추적 실행중";
        }

        function stop() {
            const videoArea = document.getElementById("videoArea");
            const status = document.getElementById("status");

            videoArea.innerHTML = "<p>영상이 중지 되었습니다.</p>";
            status.innerHTML = "중지됨";
        }
    </script>
</body>
</html>
